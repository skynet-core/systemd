# Build, test, and publish the systemd images (one per distro) to GHCR.
#
#   Image:  ghcr.io/skynet-core/systemd
#   Tags:   :fedora :debian :ubuntu :archlinux  (+ :main, + :sha-<sha>)
#
# Each matrix leg builds its distro image, runs the systemd test suite inside a
# live container (target activation + services + symlinks), and — on non-PR
# events — pushes the image to the repository's GHCR registry.

name: build-and-publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# packages:write is required for GITHUB_TOKEN to push to GHCR.
permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-and-publish:
    name: ${{ matrix.distro }}
    runs-on: ubuntu-slim
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        distro: [fedora-44, debian-13, ubuntu-26.04, archlinux]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx (docker driver so we can `load` + run tests)
        uses: docker/setup-buildx-action@v4

      # ---------------------------------------------------------------------
      # Build the image into the local daemon and run the systemd test suite.
      # ---------------------------------------------------------------------
      - name: Build image (local)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.${{ matrix.distro }}
          tags: systemd:${{ matrix.distro }}-local-test
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run systemd test suite
        working-directory: ${{ github.workspace }}
        env:
          DOCKERFILE: ${{ github.workspace }}/Dockerfile.${{ matrix.distro }}
          IMAGE_TAG: systemd:${{ matrix.distro }}-local-test
          SKIP_BUILD: "true"
          WAIT_TIMEOUT: "180"
        run: bash test/test.sh

      # ---------------------------------------------------------------------
      # Publish to GHCR (skipped on pull_request — PRs can't write packages).
      # ---------------------------------------------------------------------
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata (tags + labels)
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.GHCR }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.distro }}
            type=ref,event=branch
            type=sha
          labels: |
            org.opencontainers.image.title=systemd
            org.opencontainers.image.description=systemd-based init image ({{ matrix.distro }})

      - name: Build & push to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.${{ matrix.distro }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
